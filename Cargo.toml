[package]
name = "getcraft-photocraft-opendeck"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "OpenDeck plugin for safely running PhotoCraft CLI commands on Linux"
repository = "https://github.com/LuizGustavoWT/getcraft-photocraft-opendeck"

[[bin]]
name = "getcraft-photocraft-opendeck"
path = "src/main.rs"

[dependencies]
log = "0.4"
openaction = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simplelog = "0.12"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "time"] }
